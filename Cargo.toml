[package]
name = "tag-track-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Identify, inspect, and tag audio without transcoding"

[[bin]]
name = "tag-track"
path = "src/main.rs"

[dependencies]
audio-metadata = { git = "https://github.com/alexgorbatchev/fetch-track-cli-rust.git", rev = "ceef80acf7b50cf2b156a2b7658f780234169cfc" }
cli-command-kit = { git = "https://github.com/alexgorbatchev/cli-command-kit-rust.git", rev = "dead4a60e08c7a84bc77ef329b220bfecd57627b" }
cli-deps = { git = "https://github.com/alexgorbatchev/deps-rust.git", rev = "6aef62e44a87f65d31283a77b93925f456362069" }
cli-event-stream = { git = "https://github.com/alexgorbatchev/fetch-track-cli-rust.git", rev = "ceef80acf7b50cf2b156a2b7658f780234169cfc" }
chrono = "0.4"
clap = { version = "4.6", features = ["string"] }
dialoguer = "0.12"
dirs = "6"
indicatif = "0.18"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
url = "2.5"

[dev-dependencies]
axum = "0.8"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0
