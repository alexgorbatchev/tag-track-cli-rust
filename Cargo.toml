[package]
name = "tag-track-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Identify, inspect, and tag audio without transcoding"

[[bin]]
name = "tag-track"
path = "src/main.rs"

[dependencies]
audio-metadata = { path = "../fetch-track-cli/crates/audio-metadata" }
cli-command-kit = { path = "../cli-command-kit" }
cli-deps = { path = "../deps" }
cli-event-stream = { path = "../fetch-track-cli/crates/cli-event-stream" }
chrono = "0.4"
clap = { version = "4.6", features = ["string"] }
dialoguer = "0.12"
dirs = "6"
indicatif = "0.18"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
url = "2.5"

[dev-dependencies]
axum = "0.8"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0
